name: Upstream waveform mode asymmetry

on:
  pull_request:
    branches: [rift_O4d]
  push:
    branches: [rift_O4d]
  workflow_dispatch:

jobs:
  input-lalsuite-mode-parity:
    name: Input LALSuite mode-asymmetry regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned input code independently of RIFT
        run: |
          python -m pip install numpy==2.1.3 lalsuite==7.26.16 pytest --report upstream-mode-asymmetry-install.json
          python -m pip freeze --all > upstream-mode-asymmetry-environment.txt
      # This normal failing job is intentional while the upstream defects remain.
      # Do not add continue-on-error, xfail, skips, or symmetrization workarounds.
      - name: Check upstream physical invariants
        run: >-
          python -m pytest -v
          MonteCarloMarginalizeCode/Code/test/waveforms/test_input_phenom_mode_asymmetry.py
          --junitxml=upstream-mode-asymmetry-junit.xml
          -o junit_family=legacy
      - name: Preserve the failing input-code evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-mode-asymmetry
          path: upstream-mode-asymmetry-*
