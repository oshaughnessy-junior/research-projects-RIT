name: Weekly branch canary

on:
  schedule:
    # GitHub schedules load from master; dispatch the science branch explicitly.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  branch-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - workflow: ci.yml
            workflow-name: CI
    name: Canary / ${{ matrix.workflow-name }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TARGET_REF: rift_O4d
      WORKFLOW: ${{ matrix.workflow }}
      WORKFLOW_NAME: ${{ matrix.workflow-name }}
    steps:
      - name: Dispatch branch CI and propagate its result
        shell: bash
        run: |
          set -euo pipefail
          canary_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${WORKFLOW}"
          expected_title="${WORKFLOW_NAME} / ${canary_id} / ubuntu-latest"
          gh workflow run "$WORKFLOW" --repo "$GH_REPO" --ref "$TARGET_REF" \
            --field runner=ubuntu-latest --field canary_id="$canary_id"
          run_id=""
          discovery_error=$(mktemp)
          trap 'rm -f "$discovery_error"' EXIT
          for attempt in $(seq 1 18); do
            if run_id=$(gh run list --repo "$GH_REPO" --workflow "$WORKFLOW" \
              --branch "$TARGET_REF" --event workflow_dispatch --limit 100 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle == \"${expected_title}\") | .databaseId" \
              2>"$discovery_error"); then
              if [ -n "$run_id" ]; then
                break
              fi
            else
              discovery_status=$?
              run_id=""
              cat "$discovery_error" >&2
              # Retry transient API/transport errors within the same poll budget.
              # Authentication, permission, malformed-query and other errors fail now.
              if ! grep -Eiq 'HTTP (408|429|5[0-9]{2})([^0-9]|$)|error connecting to|connection (reset|refused)|TLS handshake timeout|i/o timeout|context deadline exceeded|temporary failure in name resolution' "$discovery_error"; then
                exit "$discovery_status"
              fi
              echo "::warning::Transient run-discovery error (attempt ${attempt}/18)"
            fi
            if [ "$attempt" -lt 18 ]; then
              sleep 10
            fi
          done
          if [ -z "$run_id" ] || [[ "$run_id" == *$'\n'* ]]; then
            echo "::error::Expected exactly one dispatched canary run for ${canary_id}"
            exit 1
          fi
          run_url="${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${run_id}"
          echo "${WORKFLOW}: ${run_url}"
          printf '%s\n' "- [${WORKFLOW_NAME}](${run_url}) (ref: ${TARGET_REF})" >> "$GITHUB_STEP_SUMMARY"
          # Propagate downstream failure/cancellation; dispatch success alone is insufficient.
          gh run watch "$run_id" --repo "$GH_REPO" --interval 30 --exit-status
